# 仓库根 ansible 配置 —— 从仓库任意目录直接跑 playbook，无需 -i / --vault-password-file：
#   ansible-playbook devops/ansible/deploy.yml -l test
#   ansible-playbook devops/ansible/deploy-agent.yml -l test_agent -K
# devops/ansible/ansible.cfg 是目录局部配置（cd 进去跑同样免参数）。
[defaults]
inventory = devops/ansible/hosts.yml
# avpm keyring 提供 vault 密码（~/.local/bin/avpm-client symlink → ~/.cargo/bin/avpm）。
# 新环境：avpm-client set wakewake-test（staging/prod 同理）。
vault_identity_list = wakewake-test@~/.local/bin/avpm-client, wakewake-staging@~/.local/bin/avpm-client, wakewake-prod@~/.local/bin/avpm-client
