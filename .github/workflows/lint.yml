# Lint workflow —— 双层路径过滤（paths-ignore 拦噪音 + dorny/paths-filter 精确路由）。
# 触发：push 到 main + PR 到 main。改纯 markdown/docs 不触发。
#
# 命令源唯一：所有门禁命令定义在 prek（根/backend/frontend 三份 prek.toml，
# format/lint/check 三组），CI 只按 项目:组 调用 prek——本地 prek 与 CI 跑的是
# 同一条命令，杜绝"本地全绿、CI 报红"的 drift。
name: Lint

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: f
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - 'backend/rustfmt.toml'
            frontend:
              - 'frontend/**'

  # 仓库级卫生（builtin fixers / check-* / agents-sync / actionlint），秒级，
  # 无语言工具链依赖 —— 不做路径过滤。
  root:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # prek 版本与本地一致（prek --version）；升级时两处同步。
      - run: pip install prek==0.4.10
      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash | bash -s -- 1.7.12
          mv actionlint /usr/local/bin/
      - name: prek (root project, all groups)
        run: prek run --all-files --group format --group lint --group check --skip backend/ --skip frontend/

  lint-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.95' # 与 backend/rust-toolchain.toml 保持一致（本地真源）
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: backend
      - run: pip install prek==0.4.10
      - name: "prek (backend: format + lint)"
        run: prek run --all-files --group format --group lint backend/

  lint-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          # 版本真源是 frontend/package.json 的 packageManager 字段。
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - run: pip install prek==0.4.10
      - name: "prek (frontend: format + lint)"
        run: prek run --all-files --group format --group lint frontend/
