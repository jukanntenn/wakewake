# E2E Tests workflow（e2e.md §10.1）。
# 触发：main 推送 + 夜间 2 点 + 手动。分钟级（~10min 全套）。
name: E2E Tests
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨 2 点（夜间全量 e2e）
# paths-ignore 对 schedule/workflow_dispatch 不生效，
# 所以夜间定时 e2e 仍会全量跑，符合预期。
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install deps
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: wakewake:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run E2E
        run: cd e2e && pnpm test # pretest 自动起容器 + 等就绪，posttest 自动 down -v
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
      - name: Upload docker logs
        if: failure()
        run: docker compose -f e2e/docker-compose.e2e.yml logs > docker-logs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: docker-logs
          path: docker-logs.txt
