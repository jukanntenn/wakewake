# prek workspace 根配置 —— 见 https://prek.j178.dev
# Install:  prek install
# Run all:  prek run --all-files
#
# 配置拆分（workspace 模式自动发现，各项目只见自己目录内的文件）：
#   prek.toml           仓库级卫生检查 + commit-msg 门禁（文档门禁由 hdsh 托管块提供）
#   backend/prek.toml   Rust 门禁（fmt / clippy / test / build）
#   frontend/prek.toml  前端门禁（prettier / eslint / tsc / vitest / build）
# 按项目精选：prek run backend:clippy、prek run frontend:lint
#
# 三组门禁（CI 与本地共用同一命令源，杜绝 drift）：
#   format —— 改写型格式化（builtin 修正器 / cargo fmt / prettier --write / ruff）。
#             PostToolUse hook（编辑后）与 pre-commit 调用；只读 --check 变体在 lint 组。
#   lint   —— 只读静态分析（clippy / fmt --check / eslint / tsc / actionlint）
#   check  —— 动态验证（文件合法性、agent-instructions-sync、测试、构建）
#
# 本地 git hook 分层：pre-commit = 快门禁（format 组自动修复）；pre-push = 慢门禁；
# manual = 仅显式调用（CI 的 build 门禁经 --hook-stage manual 触发）。

default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

# 产物目录全局排除（不喂给任何 hook）。子项目配置另有各自的排除。
exclude = """^(backend/target/|frontend/node_modules/|frontend/.next/|frontend/out/|.local/|acceptance/|e2e/node_modules/|e2e/playwright-report/|e2e/test-results/)"""

# ---- 仓库卫生（prek builtin：零依赖原生 hook；修正器改文件、改了即 exit 1） ----
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", groups = ["format"] },
  { id = "end-of-file-fixer", groups = ["format"] },
  { id = "mixed-line-ending", args = ["--fix=lf"], groups = ["format"] },
  { id = "check-yaml", groups = ["check"] },
  { id = "check-toml", groups = ["check"] },
  { id = "check-json", groups = ["check"] },
  { id = "check-merge-conflict", groups = ["check"] },
  { id = "check-added-large-files", args = ["--maxkb=1024"], groups = ["check"] },
  { id = "detect-private-key", exclude = "backend/crates/agent/src/crypto\\.rs", groups = ["check"] },
]

# ---- 仓库级门禁（pre-commit，秒级） ----
[[repos]]
repo = "local"

# Agent 指令镜像：AGENTS.md/CLAUDE.md 字节一致对（scripts/agentlib.py）+ skills 双镜像。
# 自愈：单侧变更自动拷贝并暂存旧的一侧；双侧冲突或删除才失败，报错带调和步骤。
[[repos.hooks]]
id = "agent-instructions-sync"
name = "Agent instructions in sync"
language = "system"
entry = "python3 scripts/check_agent_instructions.py"
files = "(^|/)(AGENTS|CLAUDE)\\.md$|^\\.agents/skills/|^\\.zcode/skills/|^\\.claude/skills/"
pass_filenames = false
stages = ["pre-commit"]
groups = ["check"]

# ruff（scripts/ 与 devops/ 的 Python）。未安装则优雅跳过，与 CI 的无 ruff 环境一致。
[[repos.hooks]]
id = "ruff-format"
name = "ruff format (python)"
language = "system"
entry = "command -v ruff >/dev/null || { echo 'ruff not installed, skipping'; exit 0; }; ruff format \"$@\""
shell = "bash"
files = "\\.py$"
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

# actionlint —— 校验 GitHub Actions workflow 语法/语义。check-yaml 只验证
# “是否合法 YAML”，抓不到 paths-ignore 放错位置这类“合法 YAML 但非法 workflow”
# 的错误（曾导致 4 个 workflow 0s 全挂）。需本地安装 actionlint（go install）。
[[repos.hooks]]
id = "actionlint"
name = "actionlint (workflows)"
language = "system"
entry = "actionlint"
files = "^\\.github/workflows/.*\\.(yml|yaml)$"
pass_filenames = false
stages = ["pre-commit"]
groups = ["lint"]

# ---- commit-msg: Conventional Commits（无组——group 选择不覆盖它） ----
[[repos.hooks]]
id = "conventional-commits"
name = "commit message format"
language = "system"
entry = "python3 scripts/check_commit_msg.py"
# commit-msg stage 传 Git message 文件路径作为 $1，必须接收文件名参数。
pass_filenames = true
stages = ["commit-msg"]
