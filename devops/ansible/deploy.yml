---
# wakewake 统一部署 playbook。
#
# 单 playbook 服务 dev（将来可扩 staging / production）。目标环境用 --limit 选择
# （必填），每环境的差异在 group_vars/<env>.yml。从 devops/ansible/ 运行：
#
#   cd devops/ansible
#   ansible-playbook -i hosts.yml deploy.yml -l dev --vault-password-file ~/.ansible-vault/wakewake-dev.pwd

- name: Deploy wakewake
  hosts: all
  user: "{{ user }}"
  gather_facts: false

  tasks:
    - name: Load environment vault
      ansible.builtin.include_vars:
        file: "vars/{{ env }}/vault.yml"

    - name: Require --limit so a single environment is targeted
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: >-
          Refusing to run without --limit. Specify the environment explicitly,
          e.g. -l dev, to avoid deploying to every host at once.

    - name: Ensure application directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ app_dirs }}"

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_file }}"
        mode: "0644"

    - name: Template config.toml
      ansible.builtin.template:
        src: config.toml.j2
        dest: "{{ config_file }}"
        mode: "0600"

    - name: Template Caddyfile
      ansible.builtin.template:
        src: "{{ caddyfile_template }}"
        dest: "{{ caddyfile }}"
        mode: "0644"

    - name: Pull image and recreate containers on change
      community.docker.docker_compose_v2:
        project_src: "{{ app_path }}"
        pull: always
        state: present
        remove_orphans: true
