---
# wakewake 统一部署 playbook。
#
# 单 playbook 服务全部环境，目标环境用 --limit 选择（必填），每环境差异在
# group_vars/<env>/（env.yml + vault.yml，后者 avpm 单变量加密自动加载）。
# 从仓库任意目录运行（根 ansible.cfg 提供 inventory + avpm vault 身份）：
#
#   ansible-playbook devops/ansible/deploy.yml -l test
#   ansible-playbook devops/ansible/deploy.yml -l prod -K
#
# 宿主机前置（运维负责 provisioning，本 playbook 不安装）：Docker Engine +
# compose 插件已装，部署用户已在 docker 组；prod（宿主网关型）另需宿主
# systemd Caddy 在 :443 以 import /etc/caddy/conf.d/*.caddy 方式运行。
# prod 的 -K 供网关 become 任务（Origin Cert 安装 + site 块 + reload）；
# test 无网关任务，无需 -K。
#
# 部署尾部健康校验：scripts/check_deploy.py 轮询 /api/v1/health 就绪后，比对
# /api/v1/version 的 git_sha 与本地 HEAD（浮动 main tag 防"容器活着但跑旧镜像"）。
# 从非 tag 提交点部署 staging/prod 时用 -e verify_sha=no 跳过 sha 比对。

- name: Deploy wakewake
  hosts: all
  user: "{{ user }}"
  gather_facts: false

  vars:
    check_deploy_script: "{{ playbook_dir }}/../../scripts/check_deploy.py"

  tasks:
    - name: Require --limit so a single environment is targeted
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: >-
          Refusing to run without --limit. Specify the environment explicitly,
          e.g. -l test, to avoid deploying to every host at once.

    - name: Ensure application directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ app_dirs }}"

    # ── 宿主 Caddy 网关前置校验：Origin Cert 必须先就位（cloudflare.md §4）──
    - name: Check origin cert/key presence
      ansible.builtin.stat:
        path: "{{ app_path }}/certs/{{ item }}"
      register: gateway_certs
      loop:
        - origin.pem
        - origin.key
      when: gateway_domain is defined

    - name: Fail with instructions when origin certs are missing
      ansible.builtin.fail:
        msg: >-
          {{ app_path }}/certs/origin.pem + origin.key not found.
          Create the Cloudflare Origin Certificate first (devops/cloudflare.md §4)
          and place both files there, then re-run the playbook.
      when:
        - gateway_domain is defined
        - gateway_certs.results is defined
        - gateway_certs.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_file }}"
        mode: "0644"

    - name: Template config.toml
      ansible.builtin.template:
        src: config.toml.j2
        dest: "{{ config_file }}"
        mode: "0600"

    # tls_profile=http 的环境（staging/prod）不定义 caddyfile_template：
    # 不渲染不挂载，容器直接用镜像内置 /app/Caddyfile（hostless :8443 plain HTTP）。
    - name: Template Caddyfile
      ansible.builtin.template:
        src: "{{ caddyfile_template }}"
        dest: "{{ caddyfile }}"
        mode: "0644"
      when: caddyfile_template is defined

    - name: Pull image and recreate containers on change
      community.docker.docker_compose_v2:
        project_src: "{{ app_path }}"
        pull: always
        state: present
        remove_orphans: true

    # ── 宿主 Caddy 网关（gateway_domain 定义的环境，宿主网关型拓扑）──────────
    # 容器先就绪、网关后切换：reload 发生在应用已健康之后（回环端口无曝光窗口）。
    # site 块 = CF Origin Cert 终结 TLS + CF CIDR remote_ip 守卫 → 127.0.0.1:host_port。
    - name: Ensure gateway certs directory
      become: true
      ansible.builtin.file:
        path: "{{ gateway_certs_dir }}"
        state: directory
        owner: root
        group: caddy
        mode: "0750"
      when: gateway_domain is defined

    - name: Install origin cert/key into the gateway
      become: true
      ansible.builtin.copy:
        src: "{{ app_path }}/certs/{{ item.name }}"
        dest: "{{ gateway_certs_dir }}/{{ item.name }}"
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        remote_src: true
      loop:
        - { name: origin.pem, group: caddy, mode: "0644" }
        - { name: origin.key, group: caddy, mode: "0640" }
      when: gateway_domain is defined
      notify: reload gateway caddy

    - name: Template gateway site block
      become: true
      ansible.builtin.template:
        src: wakewake.caddy.j2
        dest: "{{ gateway_site_file }}"
        mode: "0644"
      when: gateway_domain is defined
      notify: reload gateway caddy

    - name: Flush gateway reload before verifying health
      ansible.builtin.meta: flush_handlers

    # ── OTLP 遥测接线（观测栈在运维的观测服务器上，见 devops/monitoring.md）──
    # 端点+token 都在（vault）才渲染 env——守卫在 compose 模板内；未定义时
    # 容器零改动，本地 JSONL 文件模式兜底不回归。

    # ── 数据备份层（test/prod；b2_key_id 在 vault 即激活，setup-order 契约）──
    # 部署用户两台宿主均无免密 sudo：zstd 用系统包（已在），rclone 缺失时装
    # 静态二进制到 ~/.local/bin（无需 root），作业跑 systemd 用户单元+linger
    # （不走 crontab/supervisor）。操作手册：devops/backup.md。
    - name: Enable lingering so user units survive logout/reboot
      ansible.builtin.command: loginctl enable-linger {{ user }}
      changed_when: false
      when: b2_key_id is defined or kuma_heartbeat_url is defined

    - name: Check for backup stream tools
      ansible.builtin.command: sh -c 'command -v zstd && (command -v rclone || echo no-rclone)'
      changed_when: false
      register: backup_tools
      failed_when: backup_tools.rc != 0
      when: b2_key_id is defined

    - name: Install static rclone user-locally when absent
      when:
        - b2_key_id is defined
        - "'no-rclone' in backup_tools.stdout"
      block:
        - name: Download rclone release
          ansible.builtin.get_url:
            url: "{{ rclone_url }}"
            dest: "{{ home }}/rclone-{{ rclone_version }}.tar.gz"
            mode: "0600"
        - name: Unpack rclone release
          ansible.builtin.unarchive:
            src: "{{ home }}/rclone-{{ rclone_version }}.tar.gz"
            dest: "{{ home }}/.local/share/"
            remote_src: true
        - name: Place rclone binary on user PATH
          ansible.builtin.copy:
            src: "{{ home }}/.local/share/rclone-v{{ rclone_version }}-linux-amd64/rclone"
            dest: "{{ passwd_entry.stdout.split(':')[5] }}/.local/bin/rclone"
            mode: "0750"
            remote_src: true
        - name: Remove rclone tarball
          ansible.builtin.file:
            path: "{{ home }}/rclone-{{ rclone_version }}.tar.gz"
            state: absent

    - name: Install backup scripts
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "{{ app_path }}/{{ item }}"
        mode: "0750"
      loop:
        - pg-dump-backup.py
        - backup_check.py
        - backup-drill.py
      when: b2_key_id is defined

    - name: Template backup environment file
      ansible.builtin.template:
        src: backup.env.j2
        dest: "{{ app_path }}/backup.env"
        mode: "0600"
      when: b2_key_id is defined

    # systemd 用户管理器从 passwd 主目录加载单元——与 host_vars 的 home
    # （存储根，fn 上是 /vol1/1000）不一定相同（fn 的 passwd home 是
    # /home/fn），必须动态解析而非复用 {{ home }}。
    - name: Resolve the passwd home the systemd user manager loads units from
      ansible.builtin.command: getent passwd {{ user }}
      register: passwd_entry
      changed_when: false
      when: b2_key_id is defined or kuma_heartbeat_url is defined

    - name: Ensure systemd user unit directory exists
      ansible.builtin.file:
        path: "{{ passwd_entry.stdout.split(':')[5] }}/.config/systemd/user"
        state: directory
        mode: "0755"
      when: b2_key_id is defined or kuma_heartbeat_url is defined

    - name: Install backup systemd user units
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ passwd_entry.stdout.split(':')[5] }}/.config/systemd/user/{{ item | regex_replace('\\.j2$') }}"
        mode: "0644"
      loop:
        - wakewake-backup@.service.j2
        - wakewake-backup-db.timer.j2
        - wakewake-backup-check.timer.j2
        - wakewake-backup-drill.timer.j2
      when: b2_key_id is defined
      notify: reload user systemd

    - name: Enable backup timers
      ansible.builtin.systemd:
        scope: user
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - wakewake-backup-db.timer
        - wakewake-backup-check.timer
        - wakewake-backup-drill.timer
      when: b2_key_id is defined

    # ── 可用性心跳（uptime-kuma push 生产者；kuma_heartbeat_url 在 vault 即激活）──
    - name: Install heartbeat script
      ansible.builtin.copy:
        src: files/heartbeat.py
        dest: "{{ app_path }}/heartbeat.py"
        mode: "0750"
      when: kuma_heartbeat_url is defined

    - name: Install heartbeat systemd user unit
      ansible.builtin.template:
        src: wakewake-heartbeat.service.j2
        dest: "{{ passwd_entry.stdout.split(':')[5] }}/.config/systemd/user/wakewake-heartbeat.service"
        mode: "0600"
      when: kuma_heartbeat_url is defined
      notify:
        - reload user systemd
        - restart wakewake heartbeat

    # daemon_reload：首装后（或上次 play 在 flush 前中止）单元未 reload 时
    # systemd 模块看不见它——这里自足地带上 reload，不依赖 notify 路径。
    - name: Enable and start heartbeat
      ansible.builtin.systemd:
        scope: user
        name: wakewake-heartbeat
        enabled: true
        state: started
        daemon_reload: true
      when: kuma_heartbeat_url is defined

    # ── Beszel 主机指标 agent（hub 是运维护有的观测栈一半；三变量齐备才部署）──
    - name: Ensure beszel agent directory exists
      ansible.builtin.file:
        path: "{{ beszel_agent_path }}"
        state: directory
        mode: "0755"
      when:
        - beszel_hub_url is defined
        - beszel_agent_key is defined
        - beszel_agent_token is defined

    - name: Template beszel agent compose
      ansible.builtin.template:
        src: beszel-agent-compose.yml.j2
        dest: "{{ beszel_agent_path }}/docker-compose.yml"
        mode: "0644"
      when:
        - beszel_hub_url is defined
        - beszel_agent_key is defined
        - beszel_agent_token is defined

    - name: Pull and start beszel agent
      community.docker.docker_compose_v2:
        project_src: "{{ beszel_agent_path }}"
        pull: always
        state: present
      when:
        - beszel_hub_url is defined
        - beszel_agent_key is defined
        - beszel_agent_token is defined

    - name: Record expected git sha from local HEAD
      ansible.builtin.command: git rev-parse HEAD
      changed_when: false
      delegate_to: localhost
      run_once: true
      register: local_head
      when: (verify_sha | default(true) | bool)

    # 健康检查恒跑；sha 比对仅在 verify_sha 未显式关掉且本地 HEAD 已取到时附加。
    - name: Verify deployment health (and git sha)
      ansible.builtin.command:
        cmd: >-
          python3 {{ check_deploy_script }} --url {{ health_url }}
          {{ '--insecure' if (health_insecure | default(false) | bool) else '' }}
          {{ ('--sha ' ~ local_head.stdout)
             if (verify_sha | default(true) | bool and local_head.stdout is defined)
             else '' }}
      changed_when: false
      delegate_to: localhost
      run_once: true

  handlers:
    - name: reload gateway caddy
      become: true
      ansible.builtin.systemd:
        name: caddy
        state: reloaded

    - name: reload user systemd
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true

    - name: restart wakewake heartbeat
      ansible.builtin.systemd:
        scope: user
        name: wakewake-heartbeat
        state: restarted
