# Directory-local config so `ansible-playbook` works from devops/ansible/ too
# (inventory relative paths resolve against the CWD, not the config file).
# The root ansible.cfg covers the project-root invocation.
[defaults]
inventory = hosts.yml
vault_identity_list = wakewake-test@~/.local/bin/avpm-client, wakewake-staging@~/.local/bin/avpm-client, wakewake-prod@~/.local/bin/avpm-client
