---
all:
  children:
    # 远程 test 环境（fn）：滚动 main tag（LAN registry），Caddy tls internal 自签，
    # debug 全开方便排错。部署：ansible-playbook devops/ansible/deploy.yml -l test
    test:
      hosts:
        fn:
          ansible_user: fn
          ansible_host: 192.168.5.200
          ansible_python_interpreter: /usr/bin/python3.11
    # WoL agent 部署目标：与目标设备同网段的 bare-metal 主机。
    # WoL 受限广播（255.255.255.255）不跨越路由器（RFC 919），agent 必须与设备同一 L2 网段。
    test_agent:
      hosts:
        agent:
          ansible_user: alice
          ansible_host: 192.168.5.58
    # staging：VPS，容器内 Caddy plain HTTP，宿主机隧道（cloudflared 类）终结 HTTPS 回送
    # host_port。（未上线，占位：host 定后填入真实 VPS IP / 用户）
    staging:
      hosts:
        # TODO: 填入 staging VPS，如：
        # staging-host:
        #   ansible_user: alice
        #   ansible_host: <staging-vps-ip>
    # prod（abj，阿里云 ECS 59.110.22.138）：CF 橙云 → 宿主 systemd Caddy 网关 :443
    # （CF Origin Cert 终结 TLS，仅放行 CF CIDR 回源）→ 127.0.0.1:8449（容器 Caddy
    # plain HTTP，与 staging 容器侧字节同构）。与 django-dream-blog 共用宿主 Caddy。
    # 部署：ansible-playbook devops/ansible/deploy.yml -l prod -K（-K 供网关
    # site 安装的 become 任务；宿主 Docker 由运维预装）。
    prod:
      hosts:
        abj:
          ansible_user: alice
          ansible_host: 59.110.22.138
          ansible_python_interpreter: /usr/bin/python3.12
