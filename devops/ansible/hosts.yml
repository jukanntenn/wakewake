---
all:
  children:
    dev:
      hosts:
        fn:
          ansible_user: fn
          ansible_host: 192.168.5.200
          ansible_python_interpreter: /usr/bin/python3.11
    # WoL agent 部署目标：与目标设备同网段的 bare-metal 主机。
    # WoL 受限广播（255.255.255.255）不跨越路由器（RFC 919），agent 必须与设备同一 L2 网段。
    dev_agent:
      hosts:
        agent:
          ansible_user: alice
          ansible_host: 192.168.5.58
    # staging / production：VPS，HTTPS 由外部反代终结（容器内 Caddy = HTTP）。
    # 两者容器侧字节同构，差异仅在 config.toml（public_url / secrets / mailer）。
    # 填入真实 VPS IP / 用户后即可部署。host_vars/<host>.yml 给 user / home。
    staging:
      hosts:
        # TODO: 填入 staging VPS，如：
        # staging-host:
        #   ansible_user: alice
        #   ansible_host: <staging-vps-ip>
    production:
      hosts:
        # TODO: 填入 production VPS，如：
        # prod-host:
        #   ansible_user: alice
        #   ansible_host: <prod-vps-ip>
