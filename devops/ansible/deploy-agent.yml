---
# 部署 wakewake-agent 到同网段 bare-metal 主机（解决 WoL 跨网段问题）。
#
# WoL 受限广播（255.255.255.255）不跨越路由器（RFC 919），agent 必须与目标设备
# 同一 L2 网段才能唤醒。本 playbook 先在本机编译最新 agent（danger-insecure-tls
# feature 对接 dev Caddy tls internal 自签证书），再推送到同网段主机，用 supervisor
# 常驻管理（401 优雅退出 exit 0 不重启；崩溃自动重启）。
#
# 用法（从仓库任意目录，构建 + 部署一条命令，无前置操作）：
#   ansible-playbook -i devops/ansible/hosts.yml devops/ansible/deploy-agent.yml \
#     -l dev_agent --vault-password-file ~/.ansible-vault/wakewake-dev.pwd -K
#
# 常用覆盖（-e）：
#   agent_skip_build=true   跳过本地构建（用现有产物，本地迭代更快）
#   agent_cargo_bin=...     cargo 路径（默认 ~/.cargo/bin/cargo）
#   agent_local_binary=...  二进制路径（默认 playbook_dir/../../backend/target/release/）

- name: Deploy wakewake-agent
  hosts: dev_agent
  user: "{{ user }}"
  gather_facts: true

  vars:
    app_name: wakewake-agent
    apps_path: "{{ home }}/apps"
    app_path: "{{ apps_path }}/{{ app_name }}"
    bin_dir: "{{ app_path }}/bin"
    agent_binary_dest: "{{ bin_dir }}/wakewake-agent"
    agent_config: "{{ app_path }}/config.toml"
    # playbook_dir 是内置魔法变量（playbook 所在目录的绝对路径），从仓库任意位置运行均成立。
    agent_local_binary: "{{ playbook_dir }}/../../backend/target/release/wakewake-agent"
    agent_cargo_bin: "{{ lookup('env', 'HOME') }}/.cargo/bin/cargo"
    agent_skip_build: false

  roles:
    - role: supervisor
      become: yes
      become_method: sudo

  tasks:
    # 默认总在最前端重新编译，确保部署的是最新代码；产物哈希不变时 copy 不会触发重启。
    - name: Build agent binary locally with danger-insecure-tls
      ansible.builtin.command:
        cmd: "{{ agent_cargo_bin }} build --release -p wakewake-agent --features danger-insecure-tls"
        chdir: "{{ playbook_dir }}/../../backend"
      changed_when: false
      delegate_to: localhost
      run_once: true
      when: not agent_skip_build

    - name: Verify local agent binary exists
      ansible.builtin.stat:
        path: "{{ agent_local_binary }}"
      register: agent_binary_stat
      delegate_to: localhost
      run_once: true

    - name: Fail if agent binary is missing
      ansible.builtin.fail:
        msg: >-
          Agent binary not found at {{ agent_local_binary }}. Re-run without
          -e agent_skip_build=true, or build manually first:
          cd backend && cargo build --release -p wakewake-agent --features danger-insecure-tls
      when: not agent_binary_stat.stat.exists

    # agent_server_url / agent_pairing_code 来自 dev vault。deploy.yml 用 {{ env }} 拼路径，
    # 但 env: dev 只在 group_vars/dev.yml 定义（仅作用于 dev group）；agent 在 dev_agent
    # group，env 未定义。本 playbook 仅 dev 用（danger-insecure-tls 对接 dev 自签证书），
    # 故直接硬编码 dev vault 路径。
    - name: Load dev vault
      ansible.builtin.include_vars:
        file: "vars/dev/vault.yml"

    - name: Ensure paths
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ apps_path }}"
        - "{{ app_path }}"
        - "{{ bin_dir }}"
        - "{{ app_path }}/logs"

    - name: Copy agent binary (built locally with danger-insecure-tls)
      ansible.builtin.copy:
        src: "{{ agent_local_binary }}"
        dest: "{{ agent_binary_dest }}"
        mode: "0755"
      notify: restart agent program

    - name: Template agent config.toml
      ansible.builtin.template:
        src: agent-config.toml.j2
        dest: "{{ agent_config }}"
        mode: "0600"
      notify: restart agent program

    - name: Copy supervisor conf
      become: true
      become_method: sudo
      ansible.builtin.template:
        src: wakewake-agent.conf.j2
        dest: "/etc/supervisor/conf.d/wakewake-agent.conf"
        mode: "0644"
      notify: restart agent program

    - name: Add agent program to supervisor
      become: true
      become_method: sudo
      community.general.supervisorctl:
        config: /etc/supervisor/supervisord.conf
        name: wakewake-agent
        state: present

  handlers:
    - name: restart agent program
      become: yes
      become_method: sudo
      community.general.supervisorctl:
        config: /etc/supervisor/supervisord.conf
        name: wakewake-agent
        state: restarted
