# 增改 secret 时逐字段加密追加（值不落明文文件）：
#   ansible-vault encrypt_string --vault-id wakewake-prod@~/.local/bin/avpm-client \
#     '<value>' --name db_password >> devops/ansible/group_vars/prod/vault.yml
