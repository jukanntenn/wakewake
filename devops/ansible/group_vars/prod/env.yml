---
# prod - 生产环境。与 staging 容器侧字节同构，差异仅在配置。
#
# 拓扑：访客 -> Cloudflare（免费 CDN 缓存）-> 直连回源 VPS 上的容器 Caddy。
# 容器 Caddy 挂 Cloudflare Origin Cert 服务 HTTPS（Full-strict），并仅放行
# Cloudflare CIDR 的回源连接（VPS 防火墙 or Caddy remote_ip，上线时定）。
# 提升 = 改 wakewake_version（与 staging 同版本）+ 换 config.toml，重跑 playbook。
# （未上线：本文件为占位配置）

env: prod

# 与 staging 同版本：在 staging 验证通过的 artifact 原样拿到 prod 跑。
wakewake_version: "v0.1.0"
image: "jukanntenn/wakewake:{{ wakewake_version | regex_replace('^v') }}"

# TODO: 填入 prod 真实公网域名。
public_url: "https://wakewake.app"

host_port: 8449

# 经 Cloudflare 回源（Origin Cert 是 CF 签发的受信证书，非自签）。
health_url: "{{ public_url }}"
health_insecure: false

# Cloudflare 直连回源：容器 Caddy 用 CF Origin Cert 服务 HTTPS。
tls_profile: https
caddyfile_template: Caddyfile.prod

# TODO: 上线时准备 CF Origin Cert（dashboard 生成，15 年有效），路径供 Caddyfile.prod
# 挂载（建议宿主 {{ app_path }}/certs/，compose 只读挂入容器）。
# origin_cert: "{{ app_path }}/certs/origin.pem"
# origin_key: "{{ app_path }}/certs/origin.key"

debug: false

app_dirs:
  - "{{ app_path }}"
  - "{{ app_path }}/data"

# TODO: prod 邮件配置。
mailer_enabled: false
# mailer_smtp_host: ""
# mailer_smtp_port: 587
# mailer_smtp_username: ""
# mailer_smtp_password: ""  # 从 vault 注入
# mailer_from_address: "noreply@wakewake.app"
# mailer_from_name: "WakeWake"
# mailer_smtp_starttls: false
