---
# prod - 生产环境。与 staging 容器侧字节同构，差异仅在配置。
#
# 拓扑：访客 -> Cloudflare（免费 CDN 缓存）-> 直连回源 VPS 上的容器 Caddy。
# 容器 Caddy 挂 Cloudflare Origin Cert 服务 HTTPS（Full-strict），并仅放行
# Cloudflare CIDR 的回源连接（Caddy remote_ip 守卫；VPS 防火墙为可选第二层）。
# 提升 = 改 wakewake_version（与 staging 同版本）+ 换 config.toml，重跑 playbook。
# （未上线：本文件为占位配置）

env: prod

# 与 staging 同版本：在 staging 验证通过的 artifact 原样拿到 prod 跑。
wakewake_version: "v0.1.0"
image: "jukanntenn/wakewake:{{ wakewake_version | regex_replace('^v') }}"

# prod 真实公网域名（CF 橙云代理回源）。
public_url: "https://markpost.cc"

host_port: 8449

# 经 Cloudflare 回源（Origin Cert 是 CF 签发的受信证书，非自签）。
health_url: "{{ public_url }}"
health_insecure: false

# Cloudflare 直连回源：容器 Caddy 用 CF Origin Cert 服务 HTTPS。
tls_profile: https
caddyfile_template: Caddyfile.prod

# CF 接入层（cloudflare-edge WRFC）：
#   - cloudflare_cidrs：Caddyfile.prod 的 remote_ip 守卫（非 CF 直连 403）+
#     trusted_proxies（日志 client_ip = CF-Connecting-IP）共用此 CIDR 集。
#     真源 https://www.cloudflare.com/ips（2026-08 快照），季度核对刷新。
#   - server_client_ip_header：渲染进 config.toml 的 [server].client_ip_header。
#     后端据此优先读 CF-Connecting-IP（权威、单个真实访客 IP），不受
#     trusted_proxies 追加式 XFF 的左值伪造影响。与 Caddyfile.prod 守卫同进同退。
cloudflare_cidrs: >-
  173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
  141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
  197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
  104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
  2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32
  2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
server_client_ip_header: "CF-Connecting-IP"

# TODO: 上线时准备 CF Origin Cert（控制台操作见 devops/cloudflare.md §4），证书放
# 宿主 {{ app_path }}/certs/，compose 将该目录只读挂入容器 /app/certs。下方变量值
# 是容器内路径（Caddyfile.prod 直接渲染进容器内的 Caddyfile），解开注释即触发挂载。
# origin_cert: "/app/certs/origin.pem"
# origin_key: "/app/certs/origin.key"

debug: false

app_dirs:
  - "{{ app_path }}"
  - "{{ app_path }}/data"
  # Origin Cert 落点（deploy.yml 按 app_dirs 建目录；compose 在 origin_cert 定义时挂载）。
  - "{{ app_path }}/certs"

# TODO: prod 邮件配置。
mailer_enabled: false
