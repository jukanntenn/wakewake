---
# prod（abj，59.110.22.138）。与 staging 容器侧字节同构，差异仅在配置。
#
# 拓扑（markpost 同款，宿主网关型）：访客 -> Cloudflare（免费 CDN，仅 443 端口
# 有边缘缓存）-> 宿主 systemd Caddy 网关 :443（CF Origin Cert 终结 TLS +
# CF CIDR remote_ip 守卫，site 块由 deploy.yml 渲染进 /etc/caddy/conf.d/）
# -> 127.0.0.1:{{ host_port }}（容器 Caddy plain HTTP，镜像内置 Caddyfile，
# 与 staging 零挂载同构）。提升 = 改 wakewake_version + 换 config.toml，重跑
# playbook；首次运行需要 -K（装 Docker / 网关 site 的 become 任务）。

env: prod

# 钉固定版本（staging 验证通过的 artifact 原样拿到 prod 跑）。
wakewake_version: "v0.1.0-rc.1"
image: "jukanntenn/wakewake:{{ wakewake_version | regex_replace('^v') }}"

# prod 真实公网域名（CF 橙云代理回源）。
public_url: "https://wakewake.online"

host_port: 8449
# 回环发布：宿主网关型拓扑下端口只绑 127.0.0.1（对外唯一入口是宿主 Caddy :443）。
loopback_publish: true

tz: "Asia/Shanghai"

# 经 Cloudflare + 宿主网关回源（公网证书链），健康校验正常校验（无自签）。
health_url: "{{ public_url }}"
health_insecure: false

# 容器内 Caddy 是 plain HTTP：不定义 caddyfile_template → 不渲染不挂载，
# 直接用镜像内置 /app/Caddyfile（与 staging 同构）。TLS 由宿主网关终结。
tls_profile: http

# ── 宿主 Caddy 网关（deploy.yml 的网关任务 + wakewake.caddy.j2）──────────
# CF Origin Cert 由运维放置在 {{ app_path }}/certs/（操作见 devops/cloudflare.md
# §4），deploy.yml 以 root 装进 gateway_certs_dir 并渲染 site 块后 reload。
gateway_domain: "wakewake.online"
gateway_site_file: "/etc/caddy/conf.d/wakewake.caddy"
gateway_certs_dir: "/etc/caddy/certs/wakewake"

# CF 接入层（cloudflare-edge WRFC）：
#   - cloudflare_cidrs：宿主网关 site 块的 remote_ip 守卫（非 CF 直连 443 一律
#     403）。真源 https://www.cloudflare.com/ips（2026-08 快照），季度核对刷新。
#   - server_client_ip_header：渲染进 config.toml 的 [server].client_ip_header。
#     后端据此优先读 CF-Connecting-IP（权威、单个真实访客 IP），不受
#     trusted_proxies 追加式 XFF 的左值伪造影响。与网关守卫同进同退。
cloudflare_cidrs: >-
  173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
  141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
  197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
  104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
  2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32
  2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
server_client_ip_header: "CF-Connecting-IP"

# bootstrap admin：prod 必须覆盖开发默认值（admin@wakewake.local / wakewake123，
# 见 backend/config.example.toml）；密码从 vault 注入（config.toml 渲染）。
bootstrap_admin_email: "admin@wakewake.online"

debug: false

app_dirs:
  - "{{ app_path }}"
  - "{{ app_path }}/data"
  # CF Origin Cert 落点（运维放置；deploy.yml 由此拷贝进宿主 Caddy 证书目录）。
  - "{{ app_path }}/certs"

# 邮件暂未开通：无 mailer 时注册不经验证（账号按 unverified_retention_days
# 清理），密码重置邮件 Amount 不可用——admin 务必保管好 bootstrap 密码。
# 开通时：填下方字段 + vault 加密 mailer_smtp_password。
mailer_enabled: false
# mailer_smtp_host: ""
# mailer_smtp_port: 587
# mailer_smtp_username: ""
# mailer_smtp_password: ""  # 从 vault 注入
# mailer_from_address: "noreply@wakewake.online"
# mailer_from_name: "WakeWake"
# mailer_smtp_starttls: false
