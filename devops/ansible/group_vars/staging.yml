---
# staging - 远程发布预检环境。远程验收（dev）跑稳后发布这里，是 production 的提升闸门。
#
# 与 production 容器侧字节同构：同一镜像、同一 HTTP Caddyfile、同一 ansible 模板，
# 差异仅在 config.toml（public_url / secrets / mailer）。HTTPS 由外部反代终结，
# 容器内 Caddy = plain HTTP。镜像钉固定版本（非浮动 tag）：在此验证过的 artifact
# 必须与 production 跑的字节一致。

env: staging

# 发布新版本时改这里；临时覆盖用：
#   ansible-playbook ... -l staging -e wakewake_version=vX.Y.Z
wakewake_version: "v0.1.0"
image: "jukanntenn/wakewake:{{ wakewake_version }}"

# TODO: 填入 staging 真实公网域名（外部反代终结 TLS 后回送 HTTP 到容器）。
public_url: "https://staging.example.com"

# 容器侧端口是共享的 caddy_port；host_port 对外固定（外部反代回送目标）。
host_port: 8449

# 外部反代终结 TLS，容器内 Caddy 是 plain HTTP。
tls_profile: http
caddyfile_template: Caddyfile.http

debug: false

# Postgres 数据放命名卷 pgdata；app data 目录每环境都绑定挂载，故需在宿主创建。
app_dirs:
  - "{{ app_path }}"
  - "{{ app_path }}/data"

# TODO: staging 邮件配置（按需开启）。
mailer_enabled: false
# mailer_smtp_host: ""
# mailer_smtp_port: 587
# mailer_smtp_username: ""
# mailer_smtp_password: ""  # 从 vault 注入
# mailer_from_address: "noreply@staging.example.com"
# mailer_from_name: "WakeWake"
# mailer_smtp_starttls: false
