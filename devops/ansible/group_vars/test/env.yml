---
# test（fn @ 192.168.5.200）—— 远程快速迭代环境。自托管，尽可能镜像生产拓扑，
# 但无 Cloudflare。Caddy 用 tls internal 自签证书服务 HTTPS（让 secure-only Web API
# 在内网可用）。debug 全开，崩了无所谓。

env: test
image_tag: main
registry: "192.168.5.50:5000"
image: "{{ registry }}/wakewake:{{ image_tag }}"

# 容器侧端口是共享的 caddy_port；host_port 对外固定（反代/书签兼容）。
host_port: 8449

# test 是 LAN-only HTTPS（Caddy tls internal 自签证书；浏览器会弹证书警告）。
public_url: "https://192.168.5.200:8449"

# 部署后健康校验（scripts/check_deploy.py 经 public_url 检查 /api/v1/health
# + /api/v1/version 的 git_sha）。自签证书 → insecure 跳过 TLS 校验。
health_url: "{{ public_url }}"
health_insecure: true

# TLS 证书绑定的 host（从 public_url 派生；Caddy 为此 host 预签发自签证书，
# 同时作为 fallback_sni ——浏览器用 IP 直连时 ClientHello 不带 SNI，靠它回退匹配）。
tls_host: "{{ public_url | urlsplit('hostname') }}"

# 渲染 Caddyfile 的 TLS profile：https = Caddy tls internal 自签证书。
tls_profile: https

# Caddyfile 的模板源（静态文件；prod 才是需 cloudflare_cidrs 插值的模板）。
caddyfile_template: Caddyfile.test

# 远端要创建的目录。test 的 postgres 数据放命名卷 pgdata；无需宿主机绑定挂载 app data 目录，
# 但仍创建以便日志/配置落地。
app_dirs:
  - "{{ app_path }}"
  - "{{ app_path }}/data"

mailer_enabled: true
mailer_smtp_host: "192.168.5.50"
mailer_smtp_port: 1025
mailer_smtp_username: "wakewake.dev@example.com"
mailer_smtp_password: "wakewake.dev.password"
mailer_from_address: "wakewake.dev@example.com"
mailer_from_name: "WakeWake"

# ── 可观测/监控/备份接线（deploy.yml 受守卫任务；缺 vault 变量时全部惰性）──
# OTLP → 内网直连观测服务器（NAS）的 otelcol gRPC 口；token 在 vault
# （otel_otlp_token）。心跳探测宿主回环的自签 health。
otel_otlp_endpoint: "http://192.168.5.57:4317"
# fn 的回环发布口对本地客户端返回空响应（该 NAS 的 loopback 劫持，LAN IP 正常），
# 心跳走 LAN IP。prod（abj）回环正常，走 127.0.0.1。
heartbeat_health_url: "https://192.168.5.200:8449/api/v1/health"
heartbeat_insecure: true

# Beszel hub 内网直连（hub 在观测服务器上，8090）。KEY/TOKEN 从 hub 的
# Add System 对话框取（KEY 公开进 env.yml，TOKEN 走 vault beszel_agent_token）。
beszel_hub_url: "http://192.168.5.57:8090"
beszel_agent_image: "henrygd/beszel-agent:0.20.0"
# hub 公钥（非秘密，Add System 对话框/GET /api/beszel/info 同源）。
beszel_agent_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF74xu28I0XIy+B1gsT7lnEsOo7Bw6ZwlRFiF/1ksjtq"

# 对象存储备份目标（B2，S3 兼容）。密钥对走 vault（b2_key_id /
# b2_secret_access_key）——写入之日即备份层激活之日（devops/backup.md）。
b2_s3_endpoint: "s3.us-east-005.backblazeb2.com"
b2_s3_region: "us-east-005"
b2_bucket: "wakewake-backups-test"
