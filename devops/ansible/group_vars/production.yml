---
# production - 生产环境。与 staging 容器侧字节同构，差异仅在配置。
#
# 前面是 Cloudflare（CDN 缓存），但 Cloudflare 接的是外部反代，外部反代终结 TLS 后
# 以 HTTP 回送容器--所以容器内 Caddy 仍是 plain HTTP（与 staging 共用 Caddyfile.http），
# 无需感知 Cloudflare CIDR / Origin 证书。提升 = 改 wakewake_version（与 staging 同版本）
# + 换 config.toml（public_url / secrets / mailer），重跑 playbook。

env: production

# 与 staging 同版本：在 staging 验证通过的 artifact 原样拿到 production 跑。
wakewake_version: "v0.1.0"
image: "jukanntenn/wakewake:{{ wakewake_version }}"

# TODO: 填入 production 真实公网域名。
public_url: "https://wakewake.app"

host_port: 8449

# 与 staging 一致：外部反代终结 TLS，容器内 Caddy = plain HTTP。
tls_profile: http
caddyfile_template: Caddyfile.http

debug: false

app_dirs:
  - "{{ app_path }}"
  - "{{ app_path }}/data"

# TODO: production 邮件配置。
mailer_enabled: false
# mailer_smtp_host: ""
# mailer_smtp_port: 587
# mailer_smtp_username: ""
# mailer_smtp_password: ""  # 从 vault 注入
# mailer_from_address: "noreply@wakewake.app"
# mailer_from_name: "WakeWake"
# mailer_smtp_starttls: false
