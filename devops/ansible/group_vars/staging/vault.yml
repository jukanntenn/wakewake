# staging secrets —— avpm 单变量加密入库（vault-id: wakewake-staging）。
# 上线时逐字段加密追加（值不落明文）：
#   avpm-client set wakewake-staging
#   ansible-vault encrypt_string --vault-id wakewake-staging@~/.local/bin/avpm-client \
#     '<value>' --name db_password >> devops/ansible/group_vars/staging/vault.yml
#
# ⚠️ staging secrets 必须与 prod 不同（独立密钥）。
#
# 字段清单（生成命令见括号）：
#   db_password             (openssl rand -base64 24)
#   jwt_signing_key         (openssl rand -base64 32)
#   jwt_refresh_signing_key (openssl rand -base64 32)
#   password_reset_secret   (openssl rand -base64 32)
#   mailer_smtp_password    (mailer_enabled=true 时)
---
{}
