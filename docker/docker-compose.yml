# Wakewake — Docker Compose self-deploy (HTTP).
#
# Mirrors the topology used in remote dev / production: a single wakewake
# container (Caddy + Rust backend via s6-overlay) plus a sibling postgres
# reached over a shared Unix-socket volume. The app connects to postgres
# via /var/run/postgresql — postgres is never published on the host.
#
#   1. cp config.example.toml config.toml  (app config: secrets + public_url)
#      cp .env.example .env                (postgres credentials, single source
#                                           for both postgres and the app DSN)
#   2. edit both files
#   3. docker compose up -d
#   4. open http://<your-ip>:8443
#
# The baked-in Caddyfile (plain HTTP) is used as-is — no Caddyfile mount needed;
# only mount a variant if you terminate TLS inside the container (then add a
# ./Caddyfile:/app/Caddyfile:ro volume).

services:
  wakewake:
    # Image published by the release flow (devops/README.md); pin a version
    # tag instead of latest for reproducible updates.
    image: jukanntenn/wakewake:latest
    container_name: wakewake
    ports:
      - "8443:8443"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
      - postgres-socket:/var/run/postgresql
    environment:
      # DSN 单一来源：由 .env 的 POSTGRES_* 拼接（密码不写第二处）。
      # 其余应用配置在挂载的 config.toml（copy 自 config.example.toml）。
      - WAKEWAKE_DATABASE__DSN=postgres:///${POSTGRES_DB:-wakewake}?host=/var/run/postgresql&user=${POSTGRES_USER:-wakewake}&password=${POSTGRES_PASSWORD:-change-me}&sslmode=disable
      # Optional: timezone (read by s6 cont-init.d/01-setup.sh)
      - TZ=${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    # SSE 长连接按连接数吃 FD：默认 soft nofile（常见 1024）约 1000 连接即触顶。
    # 显式抬到 1M（与 tests/load 压测 override 同口径），与镜像内 s6 后端共享。
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8443/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: wakewake-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-wakewake}
      - POSTGRES_USER=${POSTGRES_USER:-wakewake}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U ${POSTGRES_USER:-wakewake} -d ${POSTGRES_DB:-wakewake}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata:
  postgres-socket:
