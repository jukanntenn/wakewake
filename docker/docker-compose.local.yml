# 本地验收 docker-compose（自签名 HTTPS）。
#
# 镜像生产拓扑（单容器 Caddy+backend via s6 + 兄弟 PG 走 Unix socket），
# 但从本地源码树 build 镜像，用 Caddy 内置 CA（自签名）替代真实证书，
# 在 release 前手动验收生产形态的配置确实能起、能服务。
#
#   docker compose -f docker/docker-compose.local.yml up -d --build
#   curl -k https://localhost:8443/api/v1/health
#   docker compose -f docker/docker-compose.local.yml down -v
#
# 与生产的差异（均为有意，已记录）：
#   - build 本地源码树  vs.  image <registry>/wakewake:<tag>
#   - public_url https://localhost:8443  vs.  真实域名
#   - Caddy tls internal（自签名）  vs.  真实证书
# 其余（PG 兄弟容器、Unix-socket 连接、GUC 调优、healthcheck）与生产完全一致。
#
# 本地验收不持久化数据：app data 目录和 PG 数据全在 ephemeral 容器内，
# down -v 即得干净环境。仅 postgres-socket IPC 卷在服务间共享。
#
# 变更联动矩阵（改 A 处必须同步 B 处，各点注释互相引用）：
#   POSTGRES_DB/USER/PASSWORD：postgres environment ↔ app WAKEWAKE_DATABASE__DSN
#     ↔ postgres healthcheck（config.local.toml [database] dsn 仅文档，被 env 覆盖）
#   APP_PORT（宿主端口）：ports ↔ WAKEWAKE_APP__PUBLIC_URL（同一插值源）
#   服务名 app / mailpit：被 Caddyfile.local SAN / config.local.toml smtp_host 引用
# 路由不变量已收敛进镜像（/app/caddy/routes.caddy）：8080 反代目标、8443 容器端口、
# /var/run/postgresql socket——改这些 = 改 docker/caddy/routes.caddy + Dockerfile，不再散落本目录。
#
# 配置走文件挂载：./config.local.toml → /app/config.toml（server 默认读取路径）。
# 首次：cp config.local.example.toml config.local.toml（含全部配置项与说明，
# 默认值/占位符）。后者已在 .gitignore / .dockerignore 中（*.local.toml），不入库。
#
# 无 mock 服务：mailpit 是真实 SMTP 服务器 + 邮件捕获（密码重置/邮件验证
# 验收），默认启动；bemfa 等集成走真实云端（agent 侧 env 默认指向 bemfa.com）。

name: wakewake-local

services:
  app:
    # 服务名被 Caddyfile.local 的 SAN（app:8443）引用（docker DNS），改名必须同步。
    image: wakewake:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: wakewake-local
    ports:
      # 宿主侧端口（.env: APP_PORT），与下方 WAKEWAKE_APP__PUBLIC_URL 同一插值源，改只改 APP_PORT。
      # 容器内 Caddy 仍固定监听 8443（不变量，见 Caddyfile.local 监听 + 本服务 healthcheck curl）。
      - "${APP_PORT:-8443}:8443"
    environment:
      # DSN 单一来源（.env 可覆盖）。改 DB 名/用户/密码必须同步：
      # postgres 服务 environment、postgres healthcheck pg_isready、config.local.toml [database] dsn（文档默认）。
      - WAKEWAKE_DATABASE__DSN=postgres:///${POSTGRES_DB:-wakewake_local}?host=/var/run/postgresql&user=${POSTGRES_USER:-wakewake}&password=${POSTGRES_PASSWORD:-wakewake}&sslmode=disable
      # 邮件链接入口，与 ports 的 APP_PORT 同源（改端口只改 APP_PORT）。
      - WAKEWAKE_APP__PUBLIC_URL=https://localhost:${APP_PORT:-8443}
    volumes:
      - ./config.local.toml:/app/config.toml:ro
      # s6 caddy run 脚本固定读 /app/Caddyfile。
      - ./Caddyfile.local:/app/Caddyfile:ro
      # socket 目录 = postgres 镜像默认（不变量）：postgres 服务同款挂载 + healthcheck -h + DSN host= 共用，改需全部同步。
      - postgres-socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 容器内打 Caddy 8443：与 Caddyfile.local 监听端口互为同步点（不变量，改需两处一起改）。
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: wakewake-local-postgres
    environment:
      # DB 名/用户/密码单一来源（.env 可覆盖）。改这里必须同步：
      # app 服务 WAKEWAKE_DATABASE__DSN、本服务 healthcheck pg_isready、config.local.toml [database] dsn（文档默认）。
      - POSTGRES_DB=${POSTGRES_DB:-wakewake_local}
      - POSTGRES_USER=${POSTGRES_USER:-wakewake}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wakewake}
    # 与生产一致的 5 个 GUC 覆盖，作 -c 旗标施加（不动镜像默认 postgresql.conf）。
    # socket 目录保持镜像默认 /var/run/postgresql（entrypoint 拥有权限）。
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - synchronous_commit=off
    volumes:
      # socket 目录不变量：与 app 服务同款挂载、healthcheck -h、DSN host= 共用，改需全部同步。
      - postgres-socket:/var/run/postgresql
    healthcheck:
      # -U/-d 与上方 POSTGRES_USER/DB 同源（.env 覆盖）；漏同步会探测不存在的库 → postgres 日志刷 FATAL 噪音。
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U ${POSTGRES_USER:-wakewake} -d ${POSTGRES_DB:-wakewake_local}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # mailpit：真实 SMTP 服务器 + Web UI/API 邮件捕获（端口 8025）。
  # backend [mailer] 指向 mailpit:1025（见 config.local.toml）。
  # 服务名被 config.local.toml [mailer] smtp_host 引用（docker DNS），改名必须同步。
  mailpit:
    image: axllent/mailpit:latest
    container_name: wakewake-local-mailpit
    ports:
      - "8025:8025"

volumes:
  postgres-socket:
